server:
  port: 8081
spring:
  security:
    oauth2:
      client:
        registration:
          auth-server:  # ← Matches resolver above
            client-id: client
            client-secret: secret
            authorization-grant-type: client_credentials
            scope: read
            provider: auth-provider
        provider:
          auth-provider:
            token-uri: http://localhost:8080/oauth2/token